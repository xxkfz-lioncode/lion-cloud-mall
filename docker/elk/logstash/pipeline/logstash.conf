# ============================================================
# Logstash 管道配置（ELK 中的 "L"）
#   input  : Filebeat 通过 Beats 协议送进来的日志（端口 5044）
#   filter : 兜底解析 + 补默认值
#   output : Elasticsearch，按天建索引 mall-logs-yyyy.MM.dd
# ============================================================

input {
  beats {
    port => 5044
  }
}

filter {
  # 正常情况下 Filebeat 已经用 ndjson 把 JSON 展开成顶层字段了。
  # 这里只做兜底：万一某条日志没解析成功（比如被截断、格式异常），
  # 就用原始 message 再解析一次，避免整条日志变成不可检索的一坨字符串。
  if ![level] {
    json {
      source => "message"
    }
  }

  # Kibana 里做聚合 / 筛选时，字段缺失会导致查询报错，这里补默认值
  if ![traceId] {
    mutate { add_field => { "traceId" => "-" } }
  }
  if ![service] {
    mutate { add_field => { "service" => "unknown" } }
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "mall-logs-%{+YYYY.MM.dd}"
  }

  # 排错用：把处理过的事件打到容器日志里（docker logs mall-logstash 可见）。
  # 稳定后可以注释掉，能省一点 CPU。
  stdout { codec => rubydebug }
}

server:
  port: 8102

spring:
  application:
    name: mall-product
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    # 默认走宿主机映射端口 3307（本机已占用 3306）；容器内部署时由 MYSQL_PORT=3306 覆盖
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3307}/mall_product?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PWD:root}
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PWD:lion123}
      database: 0
  # ---------------- 配置中心（Nacos）----------------
  # 从 Nacos 拉取配置，优先级高于本地 application.yml；optional: 表示 Nacos 不可用时也不阻塞启动
  config:
    import:
      - optional:nacos:${spring.application.name}.yaml   # 本服务私有配置：mall-product.yaml
      - optional:nacos:mall-common.yaml                  # 公共配置（按需在 Nacos 上建）
  cloud:
    nacos:
      config:
        server-addr: ${NACOS_ADDR:127.0.0.1:8848}
        group: DEFAULT_GROUP
        file-extension: yaml
        refresh-enabled: true          # 配置变更自动刷新（@ConfigurationProperties / @RefreshScope 立即生效）
        username: nacos
        password: nacos
      discovery:
        server-addr: ${NACOS_ADDR:127.0.0.1:8848}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto

sa-token:
  token-name: satoken
  timeout: 86400
  active-timeout: 1800
  is-concurrent: true
  is-share: true
  token-style: uuid
  is-read-header: true
  is-read-body: false

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha

# ---------------- Seata 分布式事务（AT 模式） ----------------
seata:
  enabled: true
  # 事务分组：参与同一个全局事务的服务必须一致
  tx-service-group: mall_tx_group
  # AT 模式：由 Seata 代理数据源，记录前后镜像，回滚时生成反向 SQL
  data-source-proxy-mode: AT
  service:
    vgroup-mapping:
      # 事务分组 -> TC 集群名（与 seata-server 的 seata.registry.nacos.cluster 对应）
      mall_tx_group: default
  registry:
    # 注册中心用 Nacos，从 Nacos 发现 TC（seata-server）
    type: nacos
    nacos:
      application: seata-server
      server-addr: ${NACOS_ADDR:127.0.0.1:8848}
      group: SEATA_GROUP
      username: nacos
      password: nacos

logging:
  level:
    com.lion.mall: debug

# 引导配置：先于 application.yml 加载，用于从 Nacos 配置中心拉取配置
spring:
  application:
    name: mall-product
  cloud:
    nacos:
      server-addr: ${NACOS_ADDR:127.0.0.1:8848}
      username: ${NACOS_USER:nacos}
      password: ${NACOS_PWD:nacos}
      discovery:
        service: mall-product
      config:
        file-extension: yaml
        refresh-enabled: true
        shared-configs:
          - data-id: mall-common.yaml
            group: DEFAULT_GROUP
            refresh: true

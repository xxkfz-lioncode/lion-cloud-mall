server:
  port: 8103

spring:
  application:
    name: mall-order
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    # 默认走宿主机映射端口 3307（本机已占用 3306）；容器内部署时由 MYSQL_PORT=3306 覆盖
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3307}/mall_order?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PWD:root}
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PWD:lion123}
      database: 0
  # ---------------- 配置中心（Nacos）----------------
  # 从 Nacos 拉取配置，优先级高于本地 application.yml；optional: 表示 Nacos 不可用时也不阻塞启动
  config:
    import:
      - optional:nacos:${spring.application.name}.yaml   # 本服务私有配置：mall-order.yaml
      - optional:nacos:mall-common.yaml                  # 公共配置（按需在 Nacos 上建）
  cloud:
    nacos:
      config:
        server-addr: ${NACOS_ADDR:127.0.0.1:8848}
        group: DEFAULT_GROUP
        file-extension: yaml
        refresh-enabled: true          # 配置变更自动刷新（@ConfigurationProperties / @RefreshScope 立即生效）
        username: nacos
        password: nacos
      discovery:
        server-addr: ${NACOS_ADDR:127.0.0.1:8848}
    openfeign:
      # 负载均衡由 Spring Cloud LoadBalancer 提供（引入 starter 后默认生效）
      # 熔断降级：默认关闭；引入 spring-cloud-starter-circuitbreaker-resilience4j
      # 并将此处改为 true，即可启用 @FeignClient 的 fallbackFactory 降级逻辑
      circuitbreaker:
        enabled: false
      client:
        config:
          default:
            connect-timeout: 3000    # 连接超时（ms）
            read-timeout: 5000       # 读取超时（ms）

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto

sa-token:
  token-name: satoken
  timeout: 86400
  active-timeout: 1800
  is-concurrent: true
  is-share: true
  token-style: uuid
  is-read-header: true
  is-read-body: false

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha

# ---------------- Seata 分布式事务（AT 模式） ----------------
seata:
  enabled: true
  # 事务分组：参与同一个全局事务的服务必须一致（本服务是 TM，下单入口）
  tx-service-group: mall_tx_group
  # AT 模式：由 Seata 代理数据源，记录前后镜像，回滚时生成反向 SQL
  data-source-proxy-mode: AT
  service:
    vgroup-mapping:
      # 事务分组 -> TC 集群名（与 seata-server 的 seata.registry.nacos.cluster 对应）
      mall_tx_group: default
  registry:
    # 注册中心用 Nacos，从 Nacos 发现 TC（seata-server）
    type: nacos
    nacos:
      application: seata-server
      server-addr: ${NACOS_ADDR:127.0.0.1:8848}
      group: SEATA_GROUP
      username: nacos
      password: nacos

# ---------------- XXL-Job 分布式任务调度 ----------------
xxl:
  job:
    admin:
      # 调度中心地址：
      #   容器部署 → 由环境变量 XXL_JOB_ADMIN 覆盖为服务名访问（见 docker-compose.yml）
      #   本地 IDEA 跑 → 用宿主机映射端口 8082
      addresses: ${XXL_JOB_ADMIN:http://127.0.0.1:8082/xxl-job-admin}
    # 必须与调度中心的 accessToken 一致，否则调度会被拒绝
    access-token: ${XXL_JOB_TOKEN:default_token}
    executor:
      # AppName：必须与 admin 后台「执行器管理」一致（建表脚本已预置 mall-order-executor）
      appname: ${XXL_JOB_APPNAME:mall-order-executor}
      # ip 留空 = 自动探测（容器里即容器 IP，与 admin 同网络可互通）
      ip:
      port: 9999
      logpath: /app/logs/xxl-job
      logretentiondays: 7

logging:
  level:
    com.lion.mall: debug

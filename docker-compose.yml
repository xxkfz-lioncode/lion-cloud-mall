# ============================================================
# lion-cloud-mall 全栈编排（唯一入口）
#
# 使用方式：
#   1) 先打包：mvn -DskipTests clean package
#   2) 再启动：docker compose up -d --build
#   3) 查看日志：docker compose logs -f mall-gateway
#   4) 彻底重置（连数据一起清）：docker compose down -v
#
# 说明：
#   本文件已合并原 docker-compose-infra.yml，现在只有这一份编排。
#   全部组件（中间件 + 微服务 + 前端）都在同一 docker 网络 mall-net 内，
#   互相用「服务名」通信，不依赖任何宿主机局域网 IP。
#
#   只想起中间件（服务在 IDEA 里跑）时，单独指定服务名即可：
#     docker compose up -d mysql redis nacos skywalking-oap skywalking-ui seata-server
#   （bin\start-infra.bat 已封装该命令）
# ============================================================

services:
  # ---------------- 基础设施 ----------------
  mysql:
    image: mysql:8.0
    container_name: mall-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      TZ: Asia/Shanghai
      LANG: C.UTF-8
    command:
      # 字符集与时区（Windows 下避免中文乱码）
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_general_ci
      --default-time-zone=+08:00
    ports:
      # 宿主机 3306 已被本机 MySQL 占用，映射到 3307（容器内仍是 3306）
      - "3307:3306"
    volumes:
      - ./docker/mysql/init:/docker-entrypoint-initdb.d
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - mall-net

  redis:
    image: redis:7.2
    container_name: mall-redis
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "lion123", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "lion123", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - mall-net

  nacos:
    image: nacos/nacos-server:v2.3.2
    container_name: mall-nacos
    restart: unless-stopped
    environment:
      MODE: standalone
      TZ: Asia/Shanghai
      # 数据存储：外置 MySQL 持久化（建表脚本见 docker/mysql/init/02-nacos-schema.sql）
      SPRING_DATASOURCE_PLATFORM: mysql
      MYSQL_SERVICE_HOST: mysql
      MYSQL_SERVICE_PORT: 3306           # 容器内端口，不是宿主机的 3307
      MYSQL_SERVICE_DB_NAME: nacos_config
      MYSQL_SERVICE_USER: root
      MYSQL_SERVICE_PASSWORD: root
      MYSQL_DATABASE_NUM: 1
      MYSQL_SERVICE_DB_PARAM: characterEncoding=utf8&connectTimeout=1000&socketTimeout=3000&autoReconnect=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
      # Nacos 2.2+ 鉴权相关必填项（默认登录账号：nacos / nacos）
      NACOS_AUTH_TOKEN: U2VjcmV0S2V5MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTIzNDU2Nzg5MDEyMzQ1Njc4OTAxMjM0NTY3ODkw
      NACOS_AUTH_IDENTITY_KEY: serverIdentity
      NACOS_AUTH_IDENTITY_VALUE: security
      # JVM 调小一点，Windows 上更省内存
      JVM_XMS: 512m
      JVM_XMX: 512m
      JVM_XMN: 256m
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "8848:8848"
      - "9848:9848"
      - "9849:9849"
    volumes:
      - nacos-data:/home/nacos/data
    networks:
      - mall-net

  # ---------------- Seata Server（TC：分布式事务协调者） ----------------
  # 版本与客户端一致（Spring Cloud Alibaba 2023.0.1.0 锁定 seata 2.0.0）
  # 控制台：http://localhost:7091  账号 seata / seata
  #
  # SEATA_IP：TC 注册到 Nacos 的「对外地址」。
  #   全容器化（本文件）→ seata-server：同网络内按服务名访问，不依赖宿主机 IP。
  #   若改回在宿主机 / IDEA 里跑服务，需改成宿主机可访问的地址
  #   （127.0.0.1 或局域网 IP），否则注册出去的是容器内网 IP（如 172.20.0.x），宿主机连不上。
  seata-server:
    image: seataio/seata-server:2.0.0
    container_name: mall-seata
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      SEATA_IP: seata-server
      SEATA_PORT: 8091
    ports:
      - "8091:8091"   # RM / TM 连接 TC
      - "7091:7091"   # Seata 控制台
    volumes:
      - ./docker/seata/application.yml:/seata-server/resources/application.yml
    depends_on:
      nacos:
        condition: service_started
    networks:
      - mall-net

  # ---------------- XXL-Job 调度中心（admin）----------------
  # 控制台：http://localhost:8082/xxl-job-admin   账号 admin / 123456
  # 库表由 docker/mysql/init/03-xxl-job-schema.sql 在 MySQL 首次启动时自动创建
  xxl-job-admin:
    image: xuxueli/xxl-job-admin:2.4.1
    container_name: mall-xxl-job-admin
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      # PARAMS：官方镜像通过命令行参数注入 Spring 配置（比环境变量更稳妥、不易因版本差异失效）
      PARAMS: "--spring.datasource.url=jdbc:mysql://mysql:3306/xxl_job?useUnicode=true&characterEncoding=UTF-8&autoReconnect=true&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true --spring.datasource.username=root --spring.datasource.password=root --xxl.job.accessToken=default_token"
    ports:
      - "8082:8080"   # 控制台（8080 已给网关、8081 已给 SkyWalking UI）
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - mall-net

  # ---------------- RabbitMQ 消息中间件 ----------------
  # 控制台：http://localhost:15672   账号 guest / guest
  # 用途：① 超时关单延迟消息（TTL + 死信交换机）② 下单成功短信通知（异步解耦）
  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: mall-rabbitmq
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"     # AMQP 协议端口（服务连接用）
      - "15672:15672"   # 管理控制台
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s
    networks:
      - mall-net

  # ---------------- 微服务 ----------------
  mall-gateway:
    build:
      context: ./mall-gateway
      dockerfile: Dockerfile
    image: lion/mall-gateway:1.0.0
    container_name: mall-gateway
    environment:
      NACOS_ADDR: nacos:8848
      REDIS_HOST: redis
      REDIS_PWD: lion123
      # SkyWalking Agent 上报地址：容器网络内用服务名，不能用 Dockerfile 里的默认值 oap:11800
      SW_AGENT_COLLECTOR_BACKEND_SERVICES: skywalking-oap:11800
      # 日志文件落盘目录（见各服务 logback-spring.xml）
      LOG_PATH: /app/logs
    volumes:
      # SkyWalking Agent：需先执行 docker/skywalking/download-agent.ps1 下载，
      # 未下载时会自动跳过 javaagent，不影响启动
      - ./docker/skywalking/agent:/skywalking/agent
      # 日志挂卷：落到宿主机 ./logs（不挂的话写进容器可写层，容器重建即丢失）
      - ./logs:/app/logs
    ports:
      - "8080:8080"
    depends_on:
      - nacos
      - redis
      - skywalking-oap
    restart: unless-stopped
    networks:
      - mall-net

  mall-user:
    build:
      context: ./mall-user
      dockerfile: Dockerfile
    image: lion/mall-user:1.0.0
    container_name: mall-user
    environment:
      NACOS_ADDR: nacos:8848
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306          # 容器网络内使用 MySQL 容器自身端口
      MYSQL_PWD: root
      REDIS_HOST: redis
      REDIS_PWD: lion123
      SW_AGENT_COLLECTOR_BACKEND_SERVICES: skywalking-oap:11800
      # 日志文件落盘目录（见各服务 logback-spring.xml）
      LOG_PATH: /app/logs
    volumes:
      - ./docker/skywalking/agent:/skywalking/agent
      # 日志挂卷：落到宿主机 ./logs（不挂的话写进容器可写层，容器重建即丢失）
      - ./logs:/app/logs
    ports:
      - "8101:8101"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      nacos:
        condition: service_started
      skywalking-oap:
        condition: service_started
      seata-server:
        condition: service_started
    restart: unless-stopped
    networks:
      - mall-net

  mall-product:
    build:
      context: ./mall-product
      dockerfile: Dockerfile
    image: lion/mall-product:1.0.0
    container_name: mall-product
    environment:
      NACOS_ADDR: nacos:8848
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306          # 容器网络内使用 MySQL 容器自身端口
      MYSQL_PWD: root
      REDIS_HOST: redis
      REDIS_PWD: lion123
      SW_AGENT_COLLECTOR_BACKEND_SERVICES: skywalking-oap:11800
      # 日志文件落盘目录（见各服务 logback-spring.xml）
      LOG_PATH: /app/logs
    volumes:
      - ./docker/skywalking/agent:/skywalking/agent
      # 日志挂卷：落到宿主机 ./logs（不挂的话写进容器可写层，容器重建即丢失）
      - ./logs:/app/logs
    ports:
      - "8102:8102"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      nacos:
        condition: service_started
      skywalking-oap:
        condition: service_started
      seata-server:
        condition: service_started
    restart: unless-stopped
    networks:
      - mall-net

  mall-order:
    build:
      context: ./mall-order
      dockerfile: Dockerfile
    image: lion/mall-order:1.0.0
    container_name: mall-order
    environment:
      NACOS_ADDR: nacos:8848
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306          # 容器网络内使用 MySQL 容器自身端口
      MYSQL_PWD: root
      REDIS_HOST: redis
      REDIS_PWD: lion123
      # XXL-Job 调度中心：容器网络内用服务名（容器内端口 8080，宿主机映射为 8082）
      XXL_JOB_ADMIN: http://xxl-job-admin:8080/xxl-job-admin
      # RabbitMQ：容器网络内用服务名（本地 IDEA 跑时用默认的 127.0.0.1:5672）
      RABBITMQ_HOST: rabbitmq
      SW_AGENT_COLLECTOR_BACKEND_SERVICES: skywalking-oap:11800
      # 日志文件落盘目录（见各服务 logback-spring.xml）
      LOG_PATH: /app/logs
    volumes:
      - ./docker/skywalking/agent:/skywalking/agent
      # 日志挂卷：落到宿主机 ./logs（不挂的话写进容器可写层，容器重建即丢失）
      - ./logs:/app/logs
    ports:
      - "8103:8103"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      nacos:
        condition: service_started
      skywalking-oap:
        condition: service_started
      seata-server:
        condition: service_started
      xxl-job-admin:
        condition: service_started
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - mall-net

  # ---------------- 前端 ----------------
  mall-frontend:
    build:
      context: ./mall-frontend
      dockerfile: Dockerfile
    image: lion/mall-frontend:1.0.0
    container_name: mall-frontend
    ports:
      - "80:80"
    depends_on:
      - mall-gateway
    restart: unless-stopped
    networks:
      - mall-net

  # ---------------- SkyWalking（APM：链路追踪 + 服务拓扑 + 性能指标） ----------------
  # 版本 9.7.0，存储为内置 H2，无需 Elasticsearch / BanyanDB。
  # 注意：10.2.0 起官方默认存储改为 BanyanDB，升级版本需一并调整 SW_STORAGE。
  skywalking-oap:
    image: apache/skywalking-oap-server:9.7.0
    container_name: mall-skywalking-oap
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      SW_STORAGE: h2
      JAVA_OPTS: "-Xms512m -Xmx1024m"
    ports:
      - "11800:11800"   # gRPC：Java Agent 上报
      - "12800:12800"   # HTTP：UI 的查询接口
    volumes:
      - skywalking-data:/skywalking/h2-data
    networks:
      - mall-net

  skywalking-ui:
    image: apache/skywalking-ui:9.7.0
    container_name: mall-skywalking-ui
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      SW_OAP_ADDRESS: http://skywalking-oap:12800
    depends_on:
      - skywalking-oap
    ports:
      - "8081:8080"     # 控制台页面（80 已给前端，网关在 8080）
    networks:
      - mall-net

networks:
  mall-net:
    driver: bridge

volumes:
  mysql-data:
  redis-data:
  nacos-data:
  skywalking-data:

server:
  port: 8080

spring:
  application:
    name: mall-gateway
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PWD:lion123}
      database: 0
  # ---------------- 配置中心（Nacos）----------------
  # 从 Nacos 拉取配置，优先级高于本地 application.yml；optional: 表示 Nacos 不可用时也不阻塞启动
  config:
    import:
      - optional:nacos:${spring.application.name}.yaml   # 本服务私有配置：mall-gateway.yaml
      - optional:nacos:mall-common.yaml                  # 公共配置（按需在 Nacos 上建）
  cloud:
    nacos:
      config:
        server-addr: ${NACOS_ADDR:127.0.0.1:8848}
        group: DEFAULT_GROUP
        file-extension: yaml
        refresh-enabled: true          # 配置变更自动刷新（@ConfigurationProperties / @RefreshScope 立即生效）
        username: nacos
        password: nacos
      discovery:
        server-addr: ${NACOS_ADDR:127.0.0.1:8848}
    gateway:
      # 开启根据服务名自动创建路由（lb://mall-user 形式依赖该能力）
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      # 全局过滤器
      #
      # 【重要】DedupeResponseHeader 绝对不能放在 default-filters 里！
      #   它是"响应阶段"过滤器，会去改写响应头（response.getHeaders().put(...)）。
      #   放在 default-filters 会作用于所有路由，包括 WebSocket 路由；
      #   而 WebSocket 升级的响应是 101 Switching Protocols，其响应头是**只读**的，
      #   put 会抛 UnsupportedOperationException，导致握手失败、连接被立即关闭。
      #   所以这里把它下移到各个 HTTP 路由上，WebSocket 路由不带它。
      #   （WebSocket 本身不受 CORS 约束，也不需要这个去重。）
      routes:
        - id: mall-user
          uri: lb://mall-user
          predicates:
            - Path=/api/user/**
          filters:
            - StripPrefix=1
            - DedupeResponseHeader=Vary Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_UNIQUE
        - id: mall-product
          uri: lb://mall-product
          predicates:
            - Path=/api/product/**
          filters:
            - StripPrefix=1
            - DedupeResponseHeader=Vary Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_UNIQUE
        - id: mall-order
          uri: lb://mall-order
          predicates:
            - Path=/api/order/**
          filters:
            - StripPrefix=1
            - DedupeResponseHeader=Vary Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_UNIQUE
        # WebSocket 推送：
        #   ① uri 必须是 lb:ws://（不能写 lb://，否则握手会被当成普通 HTTP，升级失败）
        #   ② 不能加 StripPrefix，后端端点路径就是 /ws/notify
        #   ③ 不加 DedupeResponseHeader（原因见上面注释）
        - id: mall-order-ws
          uri: lb:ws://mall-order
          predicates:
            - Path=/ws/**

# Sa-Token 配置（与各业务服务保持一致，保证 token 互通）
sa-token:
  token-name: satoken
  timeout: 86400
  active-timeout: 1800
  is-concurrent: true
  is-share: true
  token-style: uuid
  is-read-header: true
  is-read-body: false

# 网关日志：可观察路由转发情况
logging:
  level:
    org.springframework.cloud.gateway: info
